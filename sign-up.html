<!doctype html>
<html lang="en" class="light">
  
<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
<head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var t = localStorage.getItem("Clientra-theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(t);
      })();
    </script>
    <meta name="description" content="Clientra CRM – Create your account." />
    <title>Clientra – Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body
    class="bg-app-bg text-text font-['Inter'] min-h-dvh flex items-center justify-center p-4"
  >
    <div class="w-full max-w-[440px]">
      <!-- Logo -->
      <a class='flex items-center justify-center gap-2.5 mb-5 md:mb-8' href='index.html'>
        <img src="assets/images/logo.png" alt="logo" class="h-8 w-auto" />
      </a>

      <!-- Card -->
      <div class="card p-3 sm:p-5">
        <div class="mb-6">
          <h1 class="text-xl md:text-2xl font-bold text-heading tracking-tight">
            Create your account
          </h1>
          <p class="text-sm text-muted mt-1">
            Start your 14-day free trial, no credit card required
          </p>
        </div>

        <!-- Social login -->
        <button
          class="w-full flex items-center justify-center gap-3 h-11 rounded-xl border border-border bg-card text-sm font-semibold text-heading hover:bg-subtle transition-colors duration-200 mb-5"
        >
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path
              d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"
              fill="#4285F4"
            />
            <path
              d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"
              fill="#34A853"
            />
            <path
              d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"
              fill="#FBBC05"
            />
            <path
              d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z"
              fill="#EA4335"
            />
          </svg>
          Sign up with Google
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-3 mb-5">
          <div class="flex-1 h-px bg-border"></div>
          <span class="text-xs text-muted font-medium"
            >or sign up with email</span
          >
          <div class="flex-1 h-px bg-border"></div>
        </div>

        <!-- Form -->
        <form id="signup-form" novalidate>
          <div class="space-y-4">
            <!-- Name row -->
            <div class="grid sm:grid-cols-2 gap-3">
              <label class="block">
                <span class="block text-sm font-medium text-heading mb-1.5"
                  >First name</span
                >
                <input
                  type="text"
                  id="first-name"
                  placeholder="John"
                  autocomplete="given-name"
                  class="form-input"
                  required
                />
              </label>
              <label class="block">
                <span class="block text-sm font-medium text-heading mb-1.5"
                  >Last name</span
                >
                <input
                  type="text"
                  id="last-name"
                  placeholder="Doe"
                  autocomplete="family-name"
                  class="form-input"
                  required
                />
              </label>
            </div>

            <!-- Email -->
            <label class="block">
              <span class="block text-sm font-medium text-heading mb-1.5"
                >Work email</span
              >
              <input
                type="email"
                id="email"
                placeholder="you@company.com"
                autocomplete="email"
                class="form-input"
                required
              />
            </label>

            <!-- Password -->
            <label class="block">
              <span class="block text-sm font-medium text-heading mb-1.5"
                >Password</span
              >
              <div class="relative">
                <input
                  type="password"
                  id="password"
                  placeholder="Min. 8 characters"
                  autocomplete="new-password"
                  class="form-input pr-11"
                  required
                />
                <button
                  type="button"
                  id="toggle-password"
                  class="absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center text-muted hover:text-heading transition-colors"
                  aria-label="Toggle password"
                >
                  <i class="ph ph-eye text-lg" id="eye-icon"></i>
                </button>
              </div>
              <!-- Strength bar -->
              <div class="flex gap-1 mt-2" id="strength-bars">
                <div
                  class="h-1 flex-1 rounded-full bg-border transition-colors duration-300"
                  id="bar-1"
                ></div>
                <div
                  class="h-1 flex-1 rounded-full bg-border transition-colors duration-300"
                  id="bar-2"
                ></div>
                <div
                  class="h-1 flex-1 rounded-full bg-border transition-colors duration-300"
                  id="bar-3"
                ></div>
                <div
                  class="h-1 flex-1 rounded-full bg-border transition-colors duration-300"
                  id="bar-4"
                ></div>
              </div>
              <p class="text-xs text-muted mt-1" id="strength-label"></p>
            </label>

            <!-- Terms -->
            <label class="flex items-start gap-2.5 cursor-pointer select-none">
              <input type="checkbox" id="terms" class="sr-only" required />
              <span
                id="terms-box"
                class="mt-0.5 w-4.5 h-4.5 rounded-md border border-border bg-card flex items-center justify-center transition-colors duration-200 shrink-0"
              >
                <i
                  class="ph-bold ph-check text-white text-[10px]"
                  id="terms-check"
                  style="opacity: 0"
                ></i>
              </span>
              <span class="text-sm text-text leading-relaxed">
                I agree to the
                <a href="#" class="font-semibold text-accent hover:underline"
                  >Terms of Service</a
                >
                and
                <a href="#" class="font-semibold text-accent hover:underline"
                  >Privacy Policy</a
                >
              </span>
            </label>
          </div>

          <!-- Error -->
          <p
            id="form-error"
            class="hidden text-sm text-negative mt-4 flex items-center gap-1.5"
          >
            <i class="ph ph-warning-circle text-base shrink-0"></i>
            <span id="error-text"
              >Please fill in all fields and accept the terms.</span
            >
          </p>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full h-11 mt-5 rounded-xl bg-heading text-card text-sm font-semibold hover:opacity-90 transition-opacity duration-200"
          >
            Create account
          </button>
        </form>
      </div>

      <!-- Footer -->
      <p class="text-center text-sm text-muted mt-6">
        Already have an account?
        <a class='font-semibold text-accent hover:underline ml-0.5' href='sign-in.html'>Sign in</a
        >
      </p>
    </div>

    <script src="assets/js/pages/sign-up.js"></script>
  <script defer src="index.js"></script></body>


</html>
