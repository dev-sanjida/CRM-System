<!doctype html>
<html lang="en" class="light">
  
<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var t = localStorage.getItem("Clientra-theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(t);
      })();
    </script>
    <meta
      name="description"
      content="Clientra CRM – Verify your email with OTP."
    />
    <title>Clientra – OTP Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <link rel="stylesheet" href="assets/css/pages/otp-verification.css" />
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body
    class="bg-app-bg text-text font-['Inter'] min-h-dvh flex items-center justify-center p-4"
  >
    <div class="w-full max-w-[420px]">
      <!-- Logo -->
      <a class='flex items-center justify-center gap-2.5 mb-8' href='index.html'>
        <img src="assets/images/logo.png" alt="logo" class="h-8 w-auto" />
      </a>

      <div class="card p-5 sm:p-8">
        <!-- Icon -->
        <div
          class="size-12 md:size-14 rounded-2xl flex items-center justify-center mb-5"
          style="
            background: color-mix(in srgb, var(--color-info) 12%, transparent);
          "
        >
          <i
            class="ph ph-device-mobile text-3xl"
            style="color: var(--color-info)"
          ></i>
        </div>

        <h1 class="text-2xl font-bold text-heading tracking-tight">
          Verify your email
        </h1>
        <p class="text-sm text-muted mt-1.5 leading-relaxed">
          We sent a 6-digit code to
          <strong id="display-email" class="text-heading font-semibold"
            >your email</strong
          >. Enter it below to continue.
        </p>

        <form id="otp-form" novalidate class="mt-7">
          <!-- OTP inputs -->
          <div
            class="flex items-center justify-between gap-1.5"
            id="otp-group"
            role="group"
            aria-label="One-time password"
          >
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]"
              maxlength="1"
              class="otp-input"
              aria-label="Digit 1"
              autocomplete="one-time-code"
            />
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]"
              maxlength="1"
              class="otp-input"
              aria-label="Digit 2"
            />
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]"
              maxlength="1"
              class="otp-input"
              aria-label="Digit 3"
            />
            <span
              class="text-muted font-bold text-sm select-none shrink-0 px-0.5"
              >—</span
            >
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]"
              maxlength="1"
              class="otp-input"
              aria-label="Digit 4"
            />
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]"
              maxlength="1"
              class="otp-input"
              aria-label="Digit 5"
            />
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]"
              maxlength="1"
              class="otp-input"
              aria-label="Digit 6"
            />
          </div>

          <!-- Error -->
          <p
            id="otp-error"
            class="hidden text-sm text-negative mt-4 flex items-center gap-1.5"
          >
            <i class="ph ph-warning-circle text-base shrink-0"></i>
            <span id="otp-error-text">Invalid code. Please try again.</span>
          </p>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full h-11 mt-6 rounded-xl bg-heading text-card text-sm font-semibold hover:opacity-90 transition-opacity duration-200"
          >
            Verify
          </button>
        </form>

        <!-- Timer + resend -->
        <div class="mt-5 text-center text-sm text-muted">
          <span id="timer-label">Resend code in </span>
          <span id="timer" class="font-semibold text-heading">02:00</span>
          <button
            id="resend-btn"
            class="hidden font-semibold text-accent hover:underline"
          >
            Resend code
          </button>
        </div>
      </div>

      <!-- Back -->
      <p class="text-center text-sm text-muted mt-6">
        <a class='inline-flex items-center gap-1.5 font-semibold text-heading hover:text-accent transition-colors' href='sign-in.html'>
          <i class="ph ph-arrow-left text-sm"></i>
          Back to sign in
        </a>
      </p>
    </div>

    <script src="assets/js/pages/otp-verification.js"></script>
  <script defer src="index.js"></script></body>


</html>
