<!doctype html>
<html lang="en" class="light">
  
<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
<head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var t = localStorage.getItem("Clientra-theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(t);
      })();
    </script>
    <meta
      name="description"
      content="Clientra CRM – Sign in to your account."
    />
    <title>Clientra – Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body
    class="bg-app-bg text-text font-['Inter'] min-h-dvh flex items-center justify-center p-4"
  >
    <div class="w-full max-w-[420px]">
      <!-- Logo -->
      <a class='flex items-center justify-center gap-2.5 mb-5 md:mb-8' href='index.html'>
        <img src="assets/images/logo.png" alt="logo" class="h-8 w-auto" />
      </a>

      <!-- Card -->
      <div class="card p-7 sm:p-8">
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-heading tracking-tight">
            Welcome back
          </h1>
          <p class="text-sm text-muted mt-1">
            Sign in to your Clientra account
          </p>
        </div>

        <!-- Social login -->
        <button
          class="w-full flex items-center justify-center gap-3 h-11 rounded-xl border border-border bg-card text-sm font-semibold text-heading hover:bg-subtle transition-colors duration-200 mb-5"
        >
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path
              d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"
              fill="#4285F4"
            />
            <path
              d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"
              fill="#34A853"
            />
            <path
              d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"
              fill="#FBBC05"
            />
            <path
              d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z"
              fill="#EA4335"
            />
          </svg>
          Continue with Google
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-3 mb-5">
          <div class="flex-1 h-px bg-border"></div>
          <span class="text-xs text-muted font-medium"
            >or sign in with email</span
          >
          <div class="flex-1 h-px bg-border"></div>
        </div>

        <!-- Form -->
        <form id="signin-form" novalidate>
          <div class="space-y-4">
            <!-- Email -->
            <label class="block">
              <span class="block text-sm font-medium text-heading mb-1.5"
                >Email address</span
              >
              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                class="form-input"
                required
              />
            </label>

            <!-- Password -->
            <label class="block">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-sm font-medium text-heading">Password</span>
                <a class='text-xs font-semibold text-accent hover:underline' href='forgot-password.html'>Forgot password?</a
                >
              </div>
              <div class="relative">
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  class="form-input pr-11"
                  required
                />
                <button
                  type="button"
                  id="toggle-password"
                  class="absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center text-muted hover:text-heading transition-colors"
                  aria-label="Toggle password visibility"
                >
                  <i class="ph ph-eye text-lg" id="eye-icon"></i>
                </button>
              </div>
            </label>

            <!-- Remember me -->
            <label class="flex items-center gap-2.5 cursor-pointer select-none">
              <input type="checkbox" id="remember" class="sr-only peer" />
              <span
                class="w-4.5 h-4.5 rounded-md border border-border bg-card flex items-center justify-center peer-checked:bg-accent peer-checked:border-accent transition-colors duration-200 shrink-0"
              >
                <i
                  class="ph-bold ph-check text-white text-[10px] opacity-0 peer-checked:opacity-100 transition-opacity"
                ></i>
              </span>
              <span class="text-sm text-text">Remember me for 30 days</span>
            </label>
          </div>

          <!-- Error message -->
          <p
            id="form-error"
            class="hidden text-sm text-negative mt-4 flex items-center gap-1.5"
          >
            <i class="ph ph-warning-circle text-base shrink-0"></i>
            <span id="form-error-text">Invalid email or password.</span>
          </p>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full h-11 mt-5 rounded-xl bg-heading text-card text-sm font-semibold hover:opacity-90 transition-opacity duration-200 flex items-center justify-center gap-2"
          >
            Sign in
          </button>
        </form>
      </div>

      <!-- Footer -->
      <p class="text-center text-sm text-muted mt-6">
        Don't have an account?
        <a class='font-semibold text-accent hover:underline ml-0.5' href='sign-up.html'>Create account</a
        >
      </p>
    </div>

    <script src="assets/js/pages/sign-in.js"></script>
  <script defer src="index.js"></script></body>


</html>
