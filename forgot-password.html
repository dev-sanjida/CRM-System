<!doctype html>
<html lang="en" class="light">
  
<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
<head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var t = localStorage.getItem("Clientra-theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(t);
      })();
    </script>
    <meta name="description" content="Clientra CRM – Reset your password." />
    <title>Clientra – Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body
    class="bg-app-bg text-text font-['Inter'] min-h-dvh flex items-center justify-center p-4"
  >
    <div class="w-full max-w-[420px]">
      <!-- Logo -->
      <a class='flex items-center justify-center gap-2.5 mb-4 md:mb-8' href='index.html'>
        <img src="assets/images/logo.png" alt="logo" class="h-8 w-auto" />
      </a>

      <!-- Card — Request step -->
      <div class="card p-3 sm:p-5" id="step-request">
        <!-- Icon -->
        <div
          class="w-14 h-14 rounded-2xl bg-subtle flex items-center justify-center mb-5"
        >
          <i class="ph ph-lock-key text-3xl text-heading"></i>
        </div>

        <h1 class="text-2xl font-bold text-heading tracking-tight">
          Forgot password?
        </h1>
        <p class="text-sm text-muted mt-1.5 leading-relaxed">
          No worries! Enter your email and we'll send you a reset code.
        </p>

        <form id="forgot-form" novalidate class="mt-6">
          <label class="block">
            <span class="block text-sm font-medium text-heading mb-1.5"
              >Email address</span
            >
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              autocomplete="email"
              class="form-input"
              required
            />
          </label>

          <p
            id="form-error"
            class="hidden text-sm text-negative mt-3 flex items-center gap-1.5"
          >
            <i class="ph ph-warning-circle text-base shrink-0"></i>
            <span>Please enter a valid email address.</span>
          </p>

          <button
            type="submit"
            class="w-full h-11 mt-5 rounded-xl bg-heading text-card text-sm font-semibold hover:opacity-90 transition-opacity duration-200"
          >
            Send reset code
          </button>
        </form>
      </div>

      <!-- Card — Sent confirmation step -->
      <div class="card p-3 sm:p-5 hidden" id="step-sent">
        <div
          class="w-14 h-14 rounded-2xl flex items-center justify-center mb-5"
          style="
            background: color-mix(
              in srgb,
              var(--color-positive) 12%,
              transparent
            );
          "
        >
          <i
            class="ph ph-envelope-open text-3xl"
            style="color: var(--color-positive)"
          ></i>
        </div>

        <h1 class="text-2xl font-bold text-heading tracking-tight">
          Check your email
        </h1>
        <p class="text-sm text-muted mt-1.5 leading-relaxed">
          We've sent a 6-digit code to
          <strong id="sent-email" class="text-heading font-semibold"></strong>.
          The code expires in 10 minutes.
        </p>

        <a class='w-full mt-6 h-11 rounded-xl bg-heading text-card text-sm font-semibold hover:opacity-90 transition-opacity duration-200 flex items-center justify-center' href='otp-verification.html'>
          Enter code
        </a>

        <p class="text-center text-sm text-muted mt-4">
          Didn't receive it?
          <button
            id="resend-btn"
            class="font-semibold text-accent hover:underline ml-0.5"
          >
            Resend
          </button>
        </p>
      </div>

      <!-- Back link -->
      <p class="text-center text-sm text-muted mt-6">
        <a class='inline-flex items-center gap-1.5 font-semibold text-heading hover:text-accent transition-colors' href='sign-in.html'>
          <i class="ph ph-arrow-left text-sm"></i>
          Back to sign in
        </a>
      </p>
    </div>

    <script src="assets/js/pages/forgot-password.js"></script>
  <script defer src="index.js"></script></body>


</html>
